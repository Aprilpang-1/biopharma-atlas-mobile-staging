<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaWheel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>PharmaWheel</h1>
    <!-- Desktop metro map still reads this element's text (see selectArea/
         backToOverview, app.js) and displays it as plain text - untouched.
         Hidden on mobile only (see style.css mobile block), where the
         search bar below takes over as both the hint and the interactive
         search entry point. -->
    <p class="subtitle" id="subtitle">Tap a line to explore</p>
    <!-- 2026-08-22: April's "Google Maps search bar" ask - mobile-only
         (see style.css: hidden by default, shown under the 600px media
         query), replacing the old hint sentence in that same spot. Wired
         up in wireSearchBar() (app.js): typing filters lines+stations,
         matches drop down here, tapping one calls the same selectArea()/
         selectStation() every badge and station dot already uses. -->
    <div class="search-bar" id="search-bar">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <line x1="13.6" y1="13.6" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search a line or station..." autocomplete="off" />
      <div class="search-results hidden" id="search-results"></div>
    </div>
  </header>

  <div id="toolbar">
    <button id="back-btn" class="hidden">&larr; All lines</button>
    <button id="compare-btn" class="hidden">Compare (<span id="compare-count">0</span>)</button>
  </div>

  <p class="scroll-hint">Pinch to zoom &middot; drag to pan</p>

  <main id="app">
    <p id="status">Loading PharmaWheel&hellip;</p>
  </main>

  <div id="map-legend"></div>

  <button id="legend-toggle" aria-label="Show line legend" title="Show line legend">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 3 3 8 12 13 21 8 12 3"></polygon>
      <polyline points="3 12 12 17 21 12"></polyline>
      <polyline points="3 16 12 21 21 16"></polyline>
    </svg>
  </button>
  <!-- 2026-08-24: April's friend couldn't guess what the line badges
       (ON, IM, RD...) stood for - "option B" of three hint mockups shown:
       a gentle pulsing ring on the existing legend FAB (class toggled in
       app.js) plus this tooltip bubble, shown ONLY on a visitor's first
       ever visit (see wireLegendFirstVisitHint/localStorage in app.js),
       left for the user to tap the FAB themselves rather than the legend
       popping open on its own. -->
  <div id="legend-hint-tooltip" role="status">What do these mean?</div>

  <div id="sheet-backdrop" class="hidden"></div>
  <div id="detail-panel" class="hidden">
    <div class="sheet-handle" id="sheet-handle"></div>
    <div id="detail-panel-body"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
